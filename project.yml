name: Specreel
options:
  bundleIdPrefix: dev.yagna
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    COMBINE_HIDPI_IMAGES: YES
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: "2.0.0"
targets:
  Specreel:
    type: application
    platform: macOS
    sources:
      - path: Specreel
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Specreel/Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yagna.specreel
        PRODUCT_NAME: Specreel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Specreel/Info.plist
        CODE_SIGN_ENTITLEMENTS: Specreel/Specreel.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies:
      - package: KeyboardShortcuts
    scheme:
      testTargets:
        - SpecreelTests
        - SpecreelIntegrationTests
  SpecreelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SpecreelTests
    dependencies:
      - target: Specreel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yagna.specreel.tests
        GENERATE_INFOPLIST_FILE: YES
  SpecreelIntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - SpecreelIntegrationTests
    dependencies:
      - target: Specreel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.yagna.specreel.integrationtests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Specreel:
    build:
      targets:
        Specreel: all
        SpecreelTests: [test]
        SpecreelIntegrationTests: [test]
    test:
      targets:
        - SpecreelTests
        - SpecreelIntegrationTests
    run:
      config: Debug
